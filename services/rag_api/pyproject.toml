[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "httpx", "pyjwt[crypto]"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: needs the local Supabase stack"]
