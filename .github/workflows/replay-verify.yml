name: replay-verify
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: bash scripts/ci/replay-and-verify.sh
      - if: always()
        run: supabase stop
