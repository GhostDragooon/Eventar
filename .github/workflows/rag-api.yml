name: rag-api
on:
  push:
    paths: ["services/rag_api/**"]
  pull_request:
    paths: ["services/rag_api/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag_api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not integration"
